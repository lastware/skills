name: Verify skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo:
    name: Repo check and tests
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: agent-tests checkout (pinned to the commit the agent-tests skills were tested with)
        run: |
          git clone --quiet https://github.com/feuersteiner/agent-tests "$RUNNER_TEMP/agent-tests"
          git -C "$RUNNER_TEMP/agent-tests" checkout --quiet 498aa5e
          (cd "$RUNNER_TEMP/agent-tests" && bun install --ignore-scripts --frozen-lockfile --linker=hoisted)
          echo "AGENT_TESTS_CORE=$RUNNER_TEMP/agent-tests/core" >> "$GITHUB_ENV"
      - name: Every skill is named and documented
        run: node scripts/repo.mjs check
      - name: Skill tests (good answers pass, bad ones fail)
        run: node scripts/test.mjs
      - id: projects
        name: Find example and demo projects
        run: echo "projects=$(node scripts/repo.mjs projects)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify ${{ matrix.project }}
    needs: repo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.repo.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
