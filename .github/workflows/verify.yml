name: Verify skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo:
    name: Repo check
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every skill is registered, named and documented
        run: node scripts/repo.mjs check
      - name: Plugin marketplace manifest is valid
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
      - id: projects
        name: Find example and demo projects
        run: echo "projects=$(node scripts/repo.mjs projects)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify ${{ matrix.project }}
    needs: repo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.repo.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
